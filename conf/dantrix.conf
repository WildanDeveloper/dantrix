# Dantrix example configuration.
#
# Implemented since v0.6: every key below is honoured, plus the `DANTRIX_<KEY>`
# environment variable and `-o key=value` command line overrides.
# See `dantrix --help` and `dantrix --print-config`.

## Network
bind            = 0.0.0.0        # use :: for IPv6 dual stack
port            = 8080
workers         = auto           # auto = number of online CPU cores
backlog         = 4096           # capped by net.core.somaxconn
reuseport       = true
max_connections = 16384          # per worker
cpu_affinity    = false
edge_triggered  = false

## Timeouts (seconds)
header_timeout    = 10
body_timeout      = 30
send_timeout      = 30
keepalive_timeout = 30
shutdown_timeout  = 10

## HTTP limits
keepalive_requests = 1000
max_request_line   = 8k
max_header_size    = 16k
max_headers        = 100
max_body_size      = 1m

## Static files
root              = ./public
index             = index.html
directory_listing = false
follow_symlinks   = false
hidden_files      = false
sendfile          = true
sendfile_chunk    = 1m
etag              = true
default_type      = application/octet-stream
server_tokens     = true

## TCP socket options
tcp_nodelay      = true
tcp_defer_accept = 0             # seconds; 0 = disabled
tcp_fastopen     = 0             # queue length; 0 = disabled

## Logging
access_log = stdout              # off, stdout, stderr, or a file path
error_log  = stderr
log_level  = info                # error, warn, info, debug
log_format = common              # common or combined (json is not implemented yet)

## Process and privileges
daemonize = false
# pid_file = /run/dantrix.pid
# user     = dantrix
# group    = dantrix

## Status endpoint (disabled when empty; loopback only)
# status_path = /__dantrix/status
