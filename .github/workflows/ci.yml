name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }}, ${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build: [release, debug]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with -Werror
        run: |
          make clean
          if [ "${{ matrix.build }}" = "debug" ]; then
            make debug WERROR=1
          else
            make WERROR=1
          fi
      - name: Build examples
        run: make examples
      - name: Unit tests
        run: make test
      - name: Regression test (separate server processes)
        env:
          DANTRIX_TEST_PORT: ${{ matrix.cc == 'gcc' && '18101' || '18201' }}
        run: python3 tests/regression_test.py bin/dantrix

  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          mkdir -p build
          gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror \
              -O1 -g -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined -fno-omit-frame-pointer \
              src/*.c -o build/dantrix-asan
      - name: Unit tests under ASan/UBSan
        run: |
          for t in buffer file http_parser http_range http_response log mime net path pool timer util; do
            gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror \
                -O1 -g -fsanitize=address,undefined \
                -fno-sanitize-recover=undefined \
                -Isrc -Itests/unit tests/unit/test_$t.c src/buffer.c \
                src/conn.c src/file.c src/http_parser.c src/http_range.c \
                src/http_response.c src/log.c src/mime.c src/net.c \
                src/path.c src/server.c src/timer.c src/util.c src/worker.c \
                -o build/test_${t}_asan -lpthread
            ./build/test_${t}_asan
          done
      - name: Smoke test under ASan/UBSan
        run: python3 tests/smoke_test.py build/dantrix-asan
      - name: Regression test under ASan/UBSan
        env:
          DANTRIX_TEST_PORT: "18101"
        run: python3 tests/regression_test.py build/dantrix-asan
      - name: Parser fuzz harness (deterministic standalone driver)
        run: make fuzz
      - name: C10K check (2000 held connections)
        run: make test-c10k N=2000

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-format
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
              --std=c11 --error-exitcode=1 --quiet \
              --suppress=normalCheckLevelMaxBranches \
              -I src src
      - name: clang-format check
        run: |
          clang-format --dry-run --Werror src/*.c src/*.h fuzz/*.c tests/unit/*.c

  tsan:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relax ASLR entropy (TSan on newer kernels)
        run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: Unit tests under TSan
        run: make test-tsan
      - name: Multi-worker concurrency under TSan
        run: python3 tests/tsan_test.py build/tsan/dantrix
