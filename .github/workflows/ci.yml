name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }}, ${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build: [release, debug]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with -Werror
        run: |
          make clean
          if [ "${{ matrix.build }}" = "debug" ]; then
            make debug WERROR=1
          else
            make WERROR=1
          fi
      - name: Build examples
        run: make examples
      - name: Unit tests
        run: make test
      - name: Regression test (separate server processes)
        env:
          # One distinct port per matrix cell: the four build jobs run in
          # parallel, and the sanitizers job runs its own copy on 18401.
          DANTRIX_TEST_PORT: ${{ matrix.cc == 'gcc' && (matrix.build == 'debug' && '18111' || '18101') || (matrix.build == 'debug' && '18211' || '18201') }}
          # The release build lands in bin/, the debug build in build/debug/.
          DX_TEST_BIN: ${{ matrix.build == 'debug' && 'build/debug/dantrix' || 'bin/dantrix' }}
        run: python3 tests/regression_test.py "$DX_TEST_BIN"

  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    env:
      # Its own port band: this job runs in parallel with the build matrix.
      DANTRIX_TEST_PORT: "18401"
      DANTRIX_C10K_PORT: "18495"
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          mkdir -p build
          gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror \
              -O1 -g -fsanitize=address,undefined \
              -fno-sanitize-recover=undefined -fno-omit-frame-pointer \
              src/*.c -o build/dantrix-asan
      - name: Unit tests under ASan/UBSan
        run: |
          # The list is checked against the Makefile's wildcard so a newly
          # added unit test cannot silently miss this job.
          expected=$(ls tests/unit/test_*.c | sed 's#.*/test_##; s#\.c$##' | sort | tr '\n' ' ')
          got="add_header buffer config connlimit escape fcache fdcount file http_parser http_range http_response log mime net path pool process seccomp status timer util"
          if [ "$expected" != "$got " ]; then
            echo "::error::ASan unit-test list out of date. Expected: $expected"
            exit 1
          fi
          for t in $got; do
            gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror \
                -O1 -g -fsanitize=address,undefined \
                -fno-sanitize-recover=undefined \
                -Isrc -Itests/unit tests/unit/test_$t.c src/buffer.c \
                src/config.c src/conn.c src/connlimit.c src/fcache.c src/fdcount.c src/file.c src/seccomp.c src/http_parser.c src/http_range.c \
                src/http_response.c src/log.c src/mime.c src/net.c \
                src/path.c src/process.c src/server.c src/status.c src/timer.c \
                src/util.c src/worker.c \
                -o build/test_${t}_asan -lpthread
            ./build/test_${t}_asan
          done
      - name: Smoke test under ASan/UBSan
        run: python3 tests/smoke_test.py build/dantrix-asan
      - name: Regression test under ASan/UBSan
        env:
          DANTRIX_TEST_PORT: "18401"
        run: python3 tests/regression_test.py build/dantrix-asan
      - name: Parser fuzz harness (built with ASan+UBSan, not the plain Makefile rule)
        run: |
          mkdir -p build
          clang -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -DFUZZ_STANDALONE -Isrc fuzz/fuzz_http_parser.c \
              src/http_parser.c src/http_response.c src/util.c -o build/fuzz_asan
          ./build/fuzz_asan
      - name: Escape fuzz harness (HTML escaping and URL encoding, ASan+UBSan)
        run: |
          mkdir -p build
          clang -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -DFUZZ_STANDALONE -Isrc fuzz/fuzz_escape.c \
              src/file.c src/path.c src/http_range.c src/mime.c src/util.c src/fdcount.c \
              -o build/fuzz_escape_asan
          ./build/fuzz_escape_asan
      - name: Path fuzz harness (path resolution, ranges, MIME, ASan+UBSan)
        run: |
          mkdir -p build
          clang -std=c11 -D_GNU_SOURCE -Wall -Wextra -Wpedantic -Werror -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -DFUZZ_STANDALONE -Isrc fuzz/fuzz_path.c \
              src/path.c src/http_range.c src/mime.c -o build/fuzz_path_asan
          ./build/fuzz_path_asan
      - name: C10K check (2000 held connections)
        run: make test-c10k N=2000
      - name: Soak check, short run (the leak verdict must not fire on a flat server)
        env:
          DANTRIX_SOAK_PORT: "18499"
        run: |
          python3 tests/soak_test.py --seconds 60 --clients 50 --active 2 --rate 30 \
              build/dantrix-asan
      - name: Seccomp sandbox (full workload with the filter armed + enforcement)
        env:
          DANTRIX_TEST_PORT: "18496"
        run: python3 tests/seccomp_test.py build/dantrix-asan
      - name: Security claims (traversal, smuggling, splitting, injection, limits)
        env:
          DANTRIX_TEST_PORT: "18497"
        run: python3 tests/security_test.py build/dantrix-asan
      - name: TOCTOU attempt (race the filesystem against the server)
        env:
          DANTRIX_TEST_PORT: "18498"
          TOCTOU_SECONDS: "10"
        run: python3 tests/toctou_test.py build/dantrix-asan

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck python3-pip
          # clang-format is pinned to a specific release: the formatter output
          # differs between versions and the distro package (18.0.0~exp2)
          # disagrees with 18.1.8 and 19.x on macro brace lists.
          pip3 install --break-system-packages -q clang-format==18.1.8
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
              --std=c11 --error-exitcode=1 --quiet \
              --suppress=normalCheckLevelMaxBranches \
              -I src src
      - name: clang-format check
        run: |
          "$HOME/.local/bin/clang-format" --version
          "$HOME/.local/bin/clang-format" --dry-run --Werror src/*.c src/*.h fuzz/*.c tests/unit/*.c

  tsan:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relax ASLR entropy (TSan on newer kernels)
        run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: Unit tests under TSan
        run: make test-tsan
      - name: Multi-worker concurrency under TSan
        run: python3 tests/tsan_test.py build/tsan/dantrix
