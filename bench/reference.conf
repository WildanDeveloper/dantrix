# Reference-server configuration for the comparison run
# (bench/compare_reference.sh). The directives below are the shape any
# event-driven static file server needs; adjust to your instance's syntax.
#
# It is deliberately equivalent to Dantrix's benchmark configuration: the same
# worker count, the same keep-alive settings, access log off, sendfile on.
#
# Run it on a different port (8081) so both servers can be measured on the same
# machine at the same time:
#     <your reference server> -c "$PWD/bench/reference.conf" -p /tmp

worker_processes 4;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    use epoll;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;

    server {
        listen 8081 reuseport;
        root /path/to/dantrix/bench/www;

        location / {
            # Dantrix sends no index listing; the index file is served.
            index index.html;
        }
    }
}
