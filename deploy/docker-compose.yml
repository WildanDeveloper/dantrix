services:
  dantrix:
    image: dantrix:latest
    ports:
      - "8080:8080"
    volumes:
      - ./public:/var/www:ro
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped